[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader-local"
version = "0.1.0"
description = "Baixador local com preservação dos fluxos originais"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]>=2025.11.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
media-downloader = "media_downloader.gui:main"
media-downloader-cli = "media_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["media_downloader*"]
